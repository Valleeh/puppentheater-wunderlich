# Die großen Bühnenprojekte. "plakat: true" zeigt das Bild als Plakat im Hochformat.
projekte:
  vorspann: "Für Schulen, Bühnen und Erwachsene"
  titel: |-
    Zwei besondere
    Bühnenprojekte
  einleitung: "Puppenspiel trifft Musik, Schauspiel und bildende Kunst: unsere beiden großen Inszenierungen."
  liste:
    - kennung: "nussknacker"
      plakat: true
      bild: "nussknacker-plakat"
      bildtext: "Plakat: Geschichte eines Nussknackers nach Alexandre Dumas, Musik von Pjotr Iljitsch Tschaikowski"
      weitere_bilder: []
      vorspann: "Für Familien und Schulen"
      titel: "Geschichte eines Nussknackers"
      untertitel: "Nach Alexandre Dumas · Musik von Pjotr Iljitsch Tschaikowski"
      absaetze:
        - "Musik, Literatur und das Eintauchen in das klassische Weihnachtsmärchen verbinden sich zu einem besonderen Theatererlebnis – für Familien mit Kindern und als Theater-Vormittag in der Schule, dort für Schülerinnen und Schüler ab der 5. Klasse."
        - "Unsere Geschichte basiert auf der literarischen Fassung von Alexandre Dumas, die wiederum auf dem berühmten Märchen von E. T. A. Hoffmann beruht. Dazu erklingt die wunderbare Musik von Pjotr Iljitsch Tschaikowski, live am Klavier gespielt."
        - "Wir kommen mit allem Drum und Dran zu Ihnen in die Schule und verwandeln Ihre Räume in eine vorweihnachtliche Theaterwelt. Puppenspiel, Schauspiel, Musik und eine fantasievolle Ausstattung lassen die Geschichte unmittelbar vor den Augen der Kinder entstehen."
      mitwirkende:
        - wer: "Elisa Bartoszewski"
          was: "Schauspiel, Puppenspiel, Musik am Klavier"
        - wer: "Thomas Pötzsch"
          was: "Schauspiel und Regie"
      hinweise:
        - "Für Lehrerinnen und Lehrer empfehlen wir zur Vorbereitung das Unterrichtsmaterial [„Die Nußknacker-Suite“ des Lugert Verlags ↗](https://www.lugert-verlag.de/2016/neuauflage-die-nussknacker-suite-verzaubern-sie-ihre-schueler-zu-weihnachten-mit-klassik.html)."
        - "Im November 2026 spielen wir das Stück öffentlich für Familien mit Kindern – [alle Termine ansehen ↗](#termine). Schulklassen sind dort ebenso willkommen; für einen eigenen Theater-Vormittag in Ihrer Schule kommen wir gern zu Ihnen."
      video:
        datei: ""
        vorschau_bild: ""
        bildtext: ""
        knopf: ""
        unterschrift: ""
      anfrage:
        beschriftung: "Nussknacker anfragen ↗"
        betreff: "Anfrage: Geschichte eines Nussknackers"

    - kennung: "waldszenen"
      plakat: false
      bild: "waldszenen-1"
      bildtext: "Puppenspielerin und Kasper vor der farbigen Waldszenen-Kulisse"
      weitere_bilder:
        - bild: "waldszenen-2"
          bildtext: "Kasper zwischen weißen Stoffbahnen und Lichtkugeln"
        - bild: "waldszenen-klavier"
          bildtext: "Josefine Mücksch am Flügel"
      vorspann: "Für Kinder und Erwachsene"
      titel: "Waldszenen"
      untertitel: "Musik: Robert Schumann"
      absaetze:
        - "Ein interdisziplinäres Bühnenprojekt zwischen Puppenspiel, Musik, Theater und bildender Kunst. Waldszenen ist eine poetische Reise ins Unbewusste, inspiriert von Robert Schumanns gleichnamigem romantischen Klavierzyklus."
        - "Im Mittelpunkt steht der Kasper – eine vertraute und zugleich fremd wirkende Figur, die durch eine surreale Traumwelt führt. Schumanns Musik, Puppenspiel und projizierte Bildcollagen verbinden sich zu einer traumartigen Szenerie. Mit offenen Augen erleben wir die Bühne, mit geschlossenen Augen entstehen innere Bilder."
        - "Eine Stunde zwischen Traum, Konzert, Theater und bildender Kunst – ein Erlebnis für Ohr, Auge, Herz und Seele. Kinder und Erwachsene begegnen sich dabei in einer gemeinsamen Sprache: der Sprache des Herzens."
      mitwirkende:
        - wer: "Klavier"
          was: "Josefine Mücksch, Pianistin"
        - wer: "Puppenspiel"
          was: "Elisa Bartoszewski – Leiterin des Puppentheaters Wunderlich, Kirchenmusikerin, Chorleiterin und Organistin. Sie entwickelt eigene Stücke und gibt Workshops zur heilsamen Kraft von Musik."
        - wer: "Musikpsychologie & Konzeption"
          was: "Dr. Jörg Rasche – Psychoanalytiker, Musiker und Autor mit dem Schwerpunkt auf der Beziehung zwischen Musik und Psyche."
        - wer: "Bühnenbild"
          was: "Mathias Bartoszewski, Maler und Bühnenbildner"
      hinweise: []
      video:
        datei: "waldszenen-proben"
        vorschau_bild: "waldszenen-proben-poster"
        bildtext: "Kasperl zwischen grünen Stoffbahnen in der Waldszenen-Kulisse"
        knopf: "Proben ansehen · 30 Sekunden"
        unterschrift: "Einblick in die Proben zu „Waldszenen“ · 30 Sekunden, mit Ton"
      anfrage:
        beschriftung: "Waldszenen anfragen ↗"
        betreff: "Anfrage: Waldszenen"

# Die Stücke. Jedes hat entweder ein bild oder ein video. bild_ausschnitt legt
# fest, welcher Teil des Fotos zu sehen ist; titel_bild ersetzt die Überschrift
# durch einen Schriftzug. "gedicht: true" setzt die Einleitung Zeile für Zeile.
stuecke:
  vorspann: "Für kleine und größere Entdecker"
  titel: |-
    Welches Abenteuer
    darf es sein?
  einleitung: "Vom ersten Theatererlebnis für die Allerkleinsten bis zum großen Märchenabenteuer: Findet die Geschichte, die zu euren Kindern passt."
  liste:
    - kennung: "prinzessin"
      etiketten:
        - "Ein Märchen zum Mitmachen"
        - "Ab 3 Jahren"
      titel: "Das Märchen von der Prinzessin in der Suppe"
      titel_bild: ""
      bild: ""
      bild_ausschnitt: ""
      bildtext: ""
      video:
        datei: "prinzessin-in-der-suppe"
        vorschau_bild: "prinzessin-buehne"
        bildtext: "Die Spielerin mit den beiden Prinzessinnen-Puppen am weißen Bett, davor die Kinder"
        knopf: "Ausschnitt ansehen · 26 Sekunden"
        unterschrift: ""
      einleitung: |-
        Oder muss es heißen:
        „Die Prinzessin auf der Erbse“?
        Was?
        Die Kinder sollen mitspielen?
        Und ein Clown ist auch dabei?
        Na, das kann ja lustig werden!
      gedicht: true
      mehr:
        - "Elisa Bartoszewski inszeniert Hans Christian Andersens Märchen von der „ach so feinfühligen Prinzessin“ als besonders reizvolle und fantasieanregende Version. Dezent geschminkt schlüpft sie in die Rolle eines neugierigen Clowns, der dem einsamen Prinzen bei der Brautschau hilft und immer wieder den Kontakt zu den Kindern sucht."
        - "Die jungen Zuschauer werden aktiv ins Geschehen einbezogen: Der Prinz lässt sie an der Suche nach der richtigen Prinzessin teilhaben – Probeliegen auf der Erbse inbegriffen. Lustige, fantasievolle Puppen wie die Schokokuss- und die Fernsehprinzessin, einfallsreiche Kulissen und die verschiedenen Stimmen der Figuren verzaubern das Publikum. *(Presse)*"
      technik: "Aufführungsdauer ca. 45 Minuten · Bühnenfläche 3 × 3 m · wenn möglich verdunkelbarer Raum · Steckdose 16 A/220 V · Scheinwerfer, Kabel und Stative bringen wir mit."
      anfrage:
        beschriftung: "Dieses Stück anfragen ↗"
        betreff: "Anfrage: Das Märchen von der Prinzessin in der Suppe"

    - kennung: "gluecklich-im-park"
      etiketten:
        - "Für Kinder von 1,5 bis 6 Jahren"
      titel: "Glücklich im Park"
      titel_bild: "gluecklich-im-park-schriftzug"
      bild: "gluecklich-im-park"
      bild_ausschnitt: "focus-top"
      bildtext: "Lilly tanzt mit erhobenem Bein vor der Wolke"
      video:
        datei: ""
        vorschau_bild: ""
        bildtext: ""
        knopf: ""
        unterschrift: ""
      einleitung: "Die kleine Lilly nimmt die Kinder mit auf eine Reise durch die vier Jahreszeiten: Vögel singen hören, weiche Federn fühlen, Herbststürme und Regen selber machen, den Schnee fallen sehen und den Duft frisch gebackener Plätzchen riechen."
      gedicht: false
      mehr:
        - "Theater für Kinder ab eineinhalb Jahren. Kinderlieder werden live gesungen – es wird viel gesungen und gelacht! Wir zeigen den Zyklus des Lebens in Form eines Tagesablaufs: Alles kommt und geht, ein ständiges Willkommenheißen und Verabschieden, Binden und Loslassen. Und es werden Schätze gesammelt!"
        - "Ein Stück für schüchterne und mutige Kinder, laute und leise, kleine Entdecker und Auf-dem-Schoß-sitzen-Bleiber."
        - "**Liederliste:** Kuckuck, Kuckuck ruft aus dem Wald · Alle Vöglein sind schon da · Alle meine Entchen · Backe, backe Kuchen · Hejo, spann den Wagen an · Schneeflöckchen, Weißröckchen · Der Mond ist aufgegangen · Schlaf, Kindlein, schlaf"
      technik: "In eurem Kindergarten bauen wir unseren Theaterraum auf. Für Lillys „Nest“ benötigen wir 4–6 Kindertische und eine normale Steckdose. Horizont, Licht, Piano, bunte Tücher, Schnee und viele Federn bringen wir mit. Aufführungsdauer ca. 30 Minuten."
      anfrage:
        beschriftung: "Dieses Stück anfragen ↗"
        betreff: "Anfrage: Glücklich im Park"

    - kennung: "der-stern"
      etiketten:
        - "Auch als Kita-Version"
      titel: "Der Stern"
      titel_bild: ""
      bild: "irma-und-fee"
      bild_ausschnitt: "focus-stage"
      bildtext: "Hexe Irma und die Putzfee vor dem großen Stern"
      video:
        datei: ""
        vorschau_bild: ""
        bildtext: ""
        knopf: ""
        unterschrift: ""
      einleitung: "Zwei himmlische Putzfeen stehen vor einem großen Stern. Aber der leuchtet und strahlt nicht mehr! Der Inhalt seiner Zacken ist durcheinandergeraten – und am Sternenhauptplatz der Milchstraße gibt es viel zu tun."
      gedicht: false
      mehr:
        - "„Als himmlische Putzfeen von der Firma Ment ist es unsere vornehmste Aufgabe, diesen matten Stern wieder glänzend und leuchtend erscheinen zu lassen.“ Wie? Mit Freude, Musik, Licht, Witz, Duft und einer Schneeseekleerehfeedrehzehweh-Geschichte. Alle Augensterne, ob blau, braun oder grün, singen, strahlen, riechen, ordnen, freuen sich!"
        - "So viel sei verraten: Die Hexe Irma sitzt im „Duft- und Kräuterzacken“ und übernimmt nach der Aufräumarbeit eine Hauptrolle im „Geschichtenzacken“. Elisa Bartoszewski bringt als eine der himmlischen Putzfeen mit viel Witz, Ideen und der Mitwirkung des jungen Publikums den großen Stern wieder zum Strahlen. Ein Theatererlebnis, das die Sinne berührt – in einer behutsamen Version auch für Kita-Kinder buchbar."
      technik: "Aufführungsdauer ca. 45 Minuten · Bühnenfläche 3 × 3 m · wenn möglich verdunkelbarer Raum · Steckdose 16 A/220 V · Scheinwerfer, Kabel und Stative bringen wir mit."
      anfrage:
        beschriftung: "Dieses Stück anfragen ↗"
        betreff: "Anfrage: Der Stern"

    - kennung: "kasperl"
      etiketten:
        - "Kasperlkomödie ab 3 Jahren"
      titel: "… der wackelt seit 300 Jahren!"
      titel_bild: ""
      bild: "kasperl"
      bild_ausschnitt: "focus-face"
      bildtext: "Der Kasperl zeigt mit dem Finger an die Stirn"
      video:
        datei: ""
        vorschau_bild: ""
        bildtext: ""
        knopf: ""
        unterschrift: ""
      einleitung: "Es ist schon eine verzwickte Geschichte: Der Kasperl hat einen Zahn verloren, Hexe Irmas „allereinziger“ Zahn soll gerissen werden – und dann das noch: Heute keine Sprechstunde! Denn Dr. Luggi Dents Zahnbürste ist entführt worden."
      gedicht: false
      mehr:
        - "Ausgerechnet diese freche Hexe veranstaltet mit der Zahnbürste wilde Rundflüge im Publikum! Trotz alledem wird zu guter Letzt ein Milchzahn-Geheimnis verraten. Vorsicht, es wird gezaubert!"
        - "Kasperl und die Hexe Irma erzählen ihre Geschichte in einer traditionellen Guckkastenbühne. Die Puppenspielerinnen Elisa Bartoszewski und Maria Pieper verstehen es meisterlich, den aus Holz gestalteten Stockhandpuppen ganz individuelle, jedoch sehr realistische Charaktere zu verleihen. Gleichzeitig werden die Kinder immer wieder aktiv ins Geschehen einbezogen. *(Presseauszug)*"
      technik: "Aufführungsdauer ca. 45 Minuten · Bühnenfläche 3 × 3 m · wir bauen eine Guckkastenbühne auf und brauchen eine lichte Höhe von 2,55 m · wenn möglich verdunkelbarer Raum · Steckdose 16 A/220 V."
      anfrage:
        beschriftung: "Dieses Stück anfragen ↗"
        betreff: "Anfrage: … der wackelt seit 300 Jahren!"

    - kennung: "schnecke"
      etiketten:
        - "Traditionelles Kasperltheater ab 3 Jahren"
      titel: "… und die Schnecke steht Schmiere!"
      titel_bild: ""
      bild: "der-alte"
      bild_ausschnitt: ""
      bildtext: "Die Puppe des Alten mit geschlossenen Augen zwischen Wurzeln und grobem Stoff"
      video:
        datei: ""
        vorschau_bild: ""
        bildtext: ""
        knopf: ""
        unterschrift: ""
      einleitung: "Stellt euch vor: Die Brillenschlange findet ihre Brille nicht mehr, das Käferlein hat irgendwie seine Punkte verloren und die Schnecke weiß ohne Haus weder ein noch aus. Und das alles nur, weil die Hexe Irma ihre Warze nach Rezept weghexen will!"
      gedicht: false
      mehr:
        - "Ein richtiges Kasperltheater! Aber der Kasperl und die Kinder finden zu einer glücklichen Lösung. Am Ende gibt es ein großes Fest mit Haferschleimsuppe bei Herrn Alois Schneck."
        - "Die Stockhandpuppen mit ihren verschiedenen Stimmen scheinen vor den fantasievollen Kulissen zu wirklichem Leben zu erwachen. Die Kinder sind von Anfang an begeistert dabei, die Spannung steigt – man muss einfach mitmachen und den Figuren mit Rat und Tat zur Seite stehen. Letztendlich hat es Kasperl einem engagierten Publikum zu verdanken, dass er endlich lernt, wo rechts und links ist! *(Presseauszug)*"
      technik: "Aufführungsdauer ca. 45 Minuten · Bühnenfläche 3 × 3 m · Guckkastenbühne mit lichter Höhe von 2,55 m · wenn möglich verdunkelbarer Raum · Steckdose 16 A/220 V."
      anfrage:
        beschriftung: "Dieses Stück anfragen ↗"
        betreff: "Anfrage: … und die Schnecke steht Schmiere!"

    - kennung: "drei-federn"
      etiketten:
