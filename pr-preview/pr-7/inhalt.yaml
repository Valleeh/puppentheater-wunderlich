      titel: "Das Märchen von den drei Federn"
      titel_bild: ""
      bild: "dummling"
      bild_ausschnitt: "focus-stage"
      bildtext: "Zwei Puppen in glitzernder Kulisse vor einem roten Thron"
      video:
