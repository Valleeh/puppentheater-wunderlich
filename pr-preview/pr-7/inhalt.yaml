    Mit Puppen.
    *Für Kinder.*
  absaetze:
    - "Ein neugieriger Clown, eigensinnige Hexen und mutige kleine Helden: Unsere Figuren haben ihren ganz eigenen Kopf. Und die Kinder dürfen mitdenken, mitfühlen und mithelfen."
    - "**Elisa Bartoszewski** lebt in Steinfurth vor der Insel Usedom. Sie ist Puppenspielerin, Organistin und Komponistin. Mit ihren freien Improvisationen am Klavier und an der Orgel entführt sie ihre Zuhörer liebend gerne in traumhafte Musikwelten. Sie ist eine begeisterte Puppenspielerin und schreibt fantasievolle Stücke für Kinder wie auch Erwachsene, die sie deutschlandweit aufführt."
  mitgliedschaft: "Mitglied seit 1990: UNIMA – Union Internationale de la Marionnette, Zentrum Bundesrepublik Deutschland e. V. (mit Deutschem Bund für Puppenspiel) · Paul-Klinger-Künstlersozialwerk"
