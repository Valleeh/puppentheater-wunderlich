# „Gut zu wissen“: die drei Schritte und die Fragen darunter.
ablauf:
  vorspann: "Wir kommen mit unserer Bühne"
  titel: |-
    Platz für ein
    kleines Wunder.
  einleitung: "Ihr stellt den Raum, wir bringen die Geschichte. Alles Weitere klären wir gemeinsam vor der Aufführung."
  schritte:
    - titel: "Geschichte aussuchen"
      text: "Wählt ein Stück passend zum Alter eurer Kinder. Ihr seid unsicher? Wir helfen gern bei der Auswahl."
    - titel: "Termin besprechen"
      text: "Schickt uns Ort, Wunschtermin, Alter und ungefähre Anzahl der Kinder. Wir besprechen Verfügbarkeit und Angebot."
    - titel: "Vorhang auf!"
      text: "Für die meisten Stücke brauchen wir etwa 3 × 3 Meter Platz und eine Steckdose. Licht und Bühnentechnik bringen wir mit."
  fragen:
    - frage: "Was braucht ihr vor Ort?"
      antwort: "Für die meisten Stücke ist eine Bühnenfläche von etwa 3 × 3 Metern vorgesehen, dazu eine Steckdose (16 A/220 V). Wenn möglich, sollte der Raum verdunkelbar sein. Für die Guckkastenbühne der Kasperlstücke benötigen wir eine lichte Höhe von 2,55 Metern. Bei „Glücklich im Park“ kommen zusätzlich 4–6 Kindertische zum Einsatz. Scheinwerfer, Kabel und Stative bringen wir mit."
    - frage: "Wie lange dauert eine Aufführung?"
      antwort: "Das richtet sich nach dem Stück und dem Alter der Kinder, wir stimmen das gemeinsam mit euch ab. Die Zeit für Auf- und Abbau vereinbaren wir zusätzlich."
    - frage: "Wo spielt ihr und was kostet eine Aufführung?"
      antwort: "Unser Theater ist in Steinfurth bei Karlsburg, vor der Insel Usedom, zu Hause und spielt deutschlandweit – von Kitas und Schulen bis zu Bühnen und Festen. Nennt uns euren Veranstaltungsort und das gewünschte Stück, dann klären wir die Anreise und erstellen euch ein passendes Angebot."

