#
# Wer hier direkt tippt:
#   • Die Einrückung mit Leerzeichen bleibt, wie sie ist – keine Tabulatoren.
#   • Jeder Text steht zwischen "geraden Anführungszeichen"; ein gerades " im
#     Text wird als \" geschrieben. Deutsche Anführungszeichen „so“ sind frei.
#   • Mehrzeilige Texte stehen unter einem |- , jede Zeile eingerückt.
#   • In Texten: *Wort* kursiv (in Überschriften rot), **Wort** fett,
#     [Wort](https://adresse.de) ein Link.
#   • Ein leeres Feld ("") fällt auf der Website weg; ebenso ein Eintrag in
#     einer Liste, in dem gar nichts steht.
#   • Bilder werden mit ihrem Namen aus dem Ordner assets/ angegeben, ohne
#     Endung: "kasperl" für assets/kasperl.jpg.
