<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bildwelten ausprobieren – Puppentheater Wunderlich</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<style>
  :root{
    --blue:#003092; --red:#d0111f; --ink:#202b47; --muted:#5b6377;
    --line:#d8dce5; --paper:#faf9f5;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#e9ecf3; color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column;
  }
  .bar{background:var(--blue); color:#fff; padding:10px 16px; flex:0 0 auto}
  .bar-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; max-width:1500px; margin:0 auto}
  .bar strong{font-size:14px; letter-spacing:.08em; text-transform:uppercase; margin-right:6px}
  .picks{display:flex; flex-wrap:wrap; gap:8px}
  button{
    font:600 14px/1 system-ui,sans-serif; cursor:pointer;
    border:1px solid rgba(255,255,255,.45); background:transparent; color:#fff;
    border-radius:999px; padding:8px 14px;
  }
  button[aria-pressed="true"]{background:#fff; color:var(--blue); border-color:#fff}
  button:focus-visible{outline:2px solid #f1d78f; outline-offset:2px}
  .spacer{flex:1 1 auto}
  .note{background:#fff; border-bottom:1px solid var(--line); padding:9px 16px; flex:0 0 auto}
  .note div{max-width:1500px; margin:0 auto; color:var(--muted); font-size:14px}
  .note b{color:var(--ink)}
  .stage{flex:1 1 auto; overflow:auto; padding:14px; display:flex; justify-content:center}
  .frame{
    background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden;
    width:100%; height:100%; box-shadow:0 10px 30px rgba(32,43,71,.12);
  }
  .stage.phone .frame{width:390px; max-width:100%; border-radius:22px}
  iframe{width:100%; height:100%; border:0; display:block}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-row">
    <strong>Bildwelten</strong>
    <div class="picks" id="picks">
      <button data-v="1" aria-pressed="true">1 · Feinschliff</button>
      <button data-v="2" aria-pressed="false">2 · Hochformat</button>
      <button data-v="3" aria-pressed="false">3 · Ganzes Bild</button>
      <button data-v="4" aria-pressed="false">4 · Bühnenkino</button>
      <button data-v="5" aria-pressed="false">5 · Collage</button>
    </div>
    <div class="spacer"></div>
    <div class="picks" id="device">
      <button data-d="desk" aria-pressed="true">Desktop</button>
      <button data-d="phone" aria-pressed="false">Handy</button>
    </div>
  </div>
</div>

<div class="note"><div id="note"></div></div>

<div class="stage" id="stage">
  <div class="frame"><iframe id="site" src="index.html" title="Vorschau der Website"></iframe></div>
</div>

<script>
var VARIANTS = {
  1: {
    name: 'Feinschliff',
    note: 'Aufbau wie jetzt, nur die Bildausschnitte sind je Foto festgelegt: Der Alte mittig, Kasperl mit Mütze, Tänzerin mit Fuß, Ballons in der Luft.',
    css: ''
  },
  2: {
    name: 'Hochformat',
    note: 'Bildfenster 4 : 5 statt flach. Von jedem Foto ist deutlich mehr zu sehen, die Seite wird dafür länger.',
    css: '.play > img, .play-placeholder { height: auto; aspect-ratio: 4/5; }'
       + '.play-duo img { height: auto; aspect-ratio: 4/5; }'
       + '.gallery img { height: auto; aspect-ratio: 4/5; }'
  },
  3: {
    name: 'Ganzes Bild',
    note: 'Kein Beschnitt: Jedes Foto steht vollständig in einem gleich großen Rahmen auf sandfarbenem Grund.',
    css: '.play > img, .play-placeholder { height: auto; aspect-ratio: 4/3; object-fit: contain; background: #f3efe6; padding: 12px; }'
       + '.play-duo { background: #f3efe6; gap: 0; }'
       + '.play-duo img { height: auto; aspect-ratio: 3/4; object-fit: contain; background: #f3efe6; padding: 10px; }'
       + '.gallery img { height: 260px; object-fit: contain; background: #f3efe6; padding: 10px; }'
       + '.gallery figure:hover img { transform: none; }'
  },
  4: {
    name: 'Bühnenkino',
    note: 'Breites Kinoformat 16 : 9, der Stücktitel steht im Bild. Kompakt und sehr bildbetont – dafür der stärkste Beschnitt.',
    css: '.kino-media { position: relative; }'
       + '.kino-media > img { width: 100%; height: auto; aspect-ratio: 16/9; object-fit: cover; display: block; background: #eaf0f8; }'
       + '.kino-media > img.focus-top { object-position: center 8%; }'
       + '.kino-media > img.focus-high { object-position: center 6%; }'
       + '.kino-media > img.focus-face { object-position: center 22%; }'
       + '.kino-media > img.focus-stage { object-position: center 25%; }'
       + '.kino-media > img.contain { object-fit: contain; background: #f3efe6; padding: 10px; }'
       + '.play-duo img { height: auto; aspect-ratio: 8/9; }'
       + '.kino-media .kino-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 20px 16px; color: #fff;'
       + '  background: linear-gradient(to top, rgba(8,12,26,.9), rgba(8,12,26,0)); }'
       + '.kino-media .kino-text h3 { color: #fff; margin: 0; text-align: left; }'
       + '.kino-media .kino-text .meta { justify-content: flex-start; color: #f1d78f; margin: 0 0 6px; }'
       + '.kino-media .kino-text h3.lettering img { margin-left: 0; height: 48px; }'
       + '.gallery img { height: 200px; }',
    dom: function (doc) {
      doc.querySelectorAll('.play').forEach(function (card) {
        var img = card.querySelector(':scope > img, :scope > .play-duo');
        var body = card.querySelector('.play-body');
        if (!img || !body) return;
        var media = doc.createElement('div');
        media.className = 'kino-media';
        card.insertBefore(media, img);
        media.appendChild(img);
        var text = doc.createElement('div');
        text.className = 'kino-text';
        var meta = body.querySelector('.meta'), h3 = body.querySelector('h3');
        if (meta) text.appendChild(meta);
        if (h3) text.appendChild(h3);
        media.appendChild(text);
      });
    }
  },
  5: {
    name: 'Collage',
    note: 'Jedes Foto behält sein eigenes Format, die Karten stehen versetzt wie an einer Pinnwand. Nichts beschnitten, kein leerer Rand.',
    css: '.plays { display: block; columns: 3; column-gap: 30px; }'
       + '.play { break-inside: avoid; margin: 0 0 30px; }'
       + '.play > img, .play-placeholder { height: auto; }'
       + '.play-duo { grid-template-columns: 1fr; gap: 2px; }'
       + '.play-duo img { height: auto; }'
       + '.gallery { display: block; columns: 4; column-gap: 16px; }'
       + '.gallery figure { break-inside: avoid; margin: 0 0 16px; }'
       + '.gallery img { height: auto; }'
       + '@media (max-width: 1100px) { .plays { columns: 2; } .gallery { columns: 3; } }'
       + '@media (max-width: 880px) { .plays { columns: 1; } .gallery { columns: 2; } }'
  }
};

var current = '1';
var site = document.getElementById('site');
var note = document.getElementById('note');

function apply() {
  var v = VARIANTS[current];
  note.innerHTML = '<b>' + v.name + '</b> · ' + v.note;
  var doc = site.contentDocument;
  if (!doc) return;
  var old = doc.getElementById('variant-style');
  if (old) old.remove();
  if (v.css) {
    var st = doc.createElement('style');
    st.id = 'variant-style';
    st.textContent = v.css;
    doc.head.appendChild(st);
  }
  if (v.dom) v.dom(doc);
}

site.addEventListener('load', apply);

document.getElementById('picks').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  current = b.dataset.v;
  [].forEach.call(this.querySelectorAll('button'), function (x) {
    x.setAttribute('aria-pressed', String(x === b));
  });
  site.src = 'index.html?bildwelt=' + current;   // Neuladen, damit die vorige Variante sauber verschwindet
});

document.getElementById('device').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  document.getElementById('stage').classList.toggle('phone', b.dataset.d === 'phone');
  [].forEach.call(this.querySelectorAll('button'), function (x) {
    x.setAttribute('aria-pressed', String(x === b));
  });
});

apply();
</script>
</body>
</html>
