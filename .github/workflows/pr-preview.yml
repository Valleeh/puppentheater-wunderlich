# Vorschau für jeden Pull Request.
#
# Bei jedem Push in einen PR wird der Stand des PR-Branches nach
#   https://valleeh.github.io/puppentheater-wunderlich/pr-preview/pr-<Nummer>/
# veröffentlicht. Der Link wird als Kommentar im PR gepostet und bei jedem
# Push aktualisiert. Wird der PR geschlossen oder gemergt, verschwindet die
# Vorschau wieder.

name: PR-Vorschau

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Vorschau veröffentlichen oder entfernen
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
