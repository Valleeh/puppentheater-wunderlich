# Vorschau für jeden Pull Request.
#
# Bei jedem Push in einen PR werden die Inhalte aus inhalt.yaml eingesetzt und
# der Stand des PR-Branches wird nach
#   https://valleeh.github.io/puppentheater-wunderlich/pr-preview/pr-<Nummer>/
# veröffentlicht. Der Link wird als Kommentar im PR gepostet und bei jedem
# Push aktualisiert. Wird der PR geschlossen oder gemergt, verschwindet die
# Vorschau wieder.

name: PR-Vorschau

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python bereitstellen
        if: github.event.action != 'closed'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: PyYAML installieren
        if: github.event.action != 'closed'
        run: pip install pyyaml

      # Erzeugt index.html nur für die Vorschau; in den PR wird nichts
      # zurückgeschrieben. Steckt ein Fehler in inhalt.yaml, schlägt dieser
      # Schritt fehl und nennt im Protokoll die Stelle.
      - name: Inhalte aus inhalt.yaml in index.html einsetzen
        if: github.event.action != 'closed'
        run: python3 werkzeuge/seite_bauen.py

      - name: Vorschau veröffentlichen oder entfernen
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
