# Die öffentliche Website: puppentheater-wunderlich.de
#
# Einmalig im Repository eingestellt:
#   Settings → Pages → "Build and deployment"
#     Source: "Deploy from a branch", Branch "gh-pages", Ordner "/ (root)"
#     Custom domain: puppentheater-wunderlich.de
#
# Läuft bei jedem Push auf main. Im Alltag kommt main aber nur über den
# Knopf „Veröffentlichen“ zu neuen Inhalten (veroeffentlichen.yml) – der
# legt die Seite selbst ab, weil seine Pushes keine Workflows auslösen.
# Die Ordner werkstatt/ und pr-preview/ in gh-pages bleiben dabei unberührt.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  website:
    uses: ./.github/workflows/seite-veroeffentlichen.yml
    with:
      branch: main
      werkstatt: false
