# Veröffentlicht die statische Website über GitHub Pages.
#
# Einmalig im Repository aktivieren:
#   Settings → Pages → "Build and deployment" → Source: "GitHub Actions"
#
# Danach wird bei jedem Push auf main automatisch veröffentlicht unter
#   https://valleeh.github.io/puppentheater-wunderlich/
# Über "Run workflow" (Actions-Tab) kann auch ein anderer Branch veröffentlicht werden.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
