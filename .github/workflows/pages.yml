# Veröffentlicht die Website auf GitHub Pages.
#
# Einmalig im Repository einstellen:
#   Settings → Pages → "Build and deployment"
#     Source: "Deploy from a branch"
#     Branch: "gh-pages", Ordner "/ (root)"
#
# Bei jedem Push auf main werden zuerst die Inhalte aus inhalt.yaml in
# index.html eingesetzt; danach wird der Inhalt des Repositories in den Branch
# gh-pages kopiert und erscheint unter
#   https://valleeh.github.io/puppentheater-wunderlich/
#
# PR-Vorschauen (siehe pr-preview.yml) liegen im Unterordner pr-preview/
# und werden hier bewusst nicht gelöscht.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: PyYAML installieren
        run: pip install pyyaml

      - name: Inhalte aus inhalt.yaml in index.html einsetzen
        run: python3 werkzeuge/seite_bauen.py

      # Damit index.html im Repository nicht hinter inhalt.yaml zurückbleibt –
      # so bleibt die Datei auch zum Hochladen auf eigenen Webspace brauchbar.
      # Schlägt das fehl (z. B. weil main geschützt ist), wird trotzdem
      # veröffentlicht.
      - name: Erzeugte index.html zurückschreiben
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "index.html aus inhalt.yaml erzeugt"
            git push origin HEAD:main
          fi

      - name: Website nach gh-pages veröffentlichen
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview/
          force: false
          commit-message: "Website von main veröffentlichen"
